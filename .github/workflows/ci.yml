name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patternly-backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: patternly-backend
      - name: Checkout mobile API consumer
        uses: actions/checkout@v4
        with:
          repository: lukaszkurczab/gcp-ace-trainer
          ref: main
          path: patternly
      - name: Checkout web API consumer
        uses: actions/checkout@v4
        with:
          repository: lukaszkurczab/patternly-web
          ref: main
          path: patternly-web
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: patternly-backend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install Firebase Emulator CLI
        run: npm install --global firebase-tools@15.19.0
      - run: npm run ci
